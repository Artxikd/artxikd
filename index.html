<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artxikd</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(135deg,#0b0b0d,#1a1a23);
color:#fff;
overflow:hidden;
}

/* particles */
.particles{
position:fixed;
inset:0;
z-index:0;
overflow:hidden;
}

.particle{
position:absolute;
width:3px;
height:3px;
background:rgba(255,255,255,0.4);
border-radius:50%;
animation:float linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

/* loader */
.loader{
position:fixed;
inset:0;
background:#0b0b0d;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}
.loader-dot{
width:8px;height:8px;border-radius:50%;
background:#3b82f6;
animation:pulse 1.2s infinite;
}
@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.5);}
100%{transform:scale(1);}
}

/* card */
.card{
position:relative;
z-index:2;

width:90%;
max-width:340px;
padding:22px;

border-radius:24px;
background:rgba(255,255,255,0.05);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

box-shadow:0 15px 40px rgba(0,0,0,0.5);
overflow:hidden; /* 🔥 фикс выхода стекла */
}

/* avatar */
.avatar{
width:82px;height:82px;
border-radius:50%;
margin:0 auto 12px;
background:url("avatar.jpg") center/cover no-repeat;
filter:grayscale(100%);
}

/* name */
.name{display:flex;justify-content:center;gap:6px;}
.check{color:#3b82f6;}

/* desc */
.desc{text-align:center;font-size:12px;opacity:.6;margin:8px 0 18px;}

/* buttons */
.section{display:flex;flex-direction:column;gap:12px;}

/* glass button */
.glass-btn{
position:relative;
display:flex;
align-items:center;
gap:10px;

padding:14px 18px;
border-radius:22px;

color:#fff;
text-decoration:none;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

border:1.5px solid rgba(255,255,255,0.35);

box-shadow:
0 10px 30px rgba(0,0,0,0.45),
inset 0 1px 1px rgba(255,255,255,0.35),
inset 0 -2px 6px rgba(0,0,0,0.3);

transition:.25s;
overflow:hidden; /* 🔥 чтобы блики не выходили */
}

/* shine */
.glass-btn::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:50%;
background:linear-gradient(to bottom,rgba(255,255,255,.35),transparent);
}

/* glow */
.glass-btn::after{
content:"";
position:absolute;
inset:0;
background:radial-gradient(circle at top left,rgba(255,255,255,.25),transparent);
}

/* click */
.glass-btn:active{
transform:scale(.96);
}

.glass-btn img{
width:22px;
height:22px;
}

/* itd text */
.itd-sub{
font-size:12px;
opacity:.6;
}

/* footer */
footer{
text-align:center;
font-size:10px;
opacity:.3;
margin-top:10px;
}

</style>
</head>

<body>

<div class="particles" id="particles"></div>

<div class="loader"><div class="loader-dot"></div></div>

<div class="card">

<div class="avatar"></div>

<div class="name">
<h1>artxikd</h1>
<i class="fa-solid fa-circle-check check"></i>
</div>

<div class="desc">ﮩ٨ـﮩﮩ٨ـ♡ﮩ٨ـﮩﮩ٨ـ</div>

<div class="section">

<a class="glass-btn" href="https://www.instagram.com/_artxikd_"><i class="fa-brands fa-instagram"></i> Instagram</a>

<a class="glass-btn" href="https://t.me/artxikd"><i class="fa-brands fa-telegram"></i> Telegram</a>

<a class="glass-btn" href="https://vm.tiktok.com/ZNRBYrefc/"><i class="fa-brands fa-tiktok"></i> TikTok</a>

<a class="glass-btn" href="https://on.soundcloud.com/gOr3fIGj24F6OPVqpZ"><img src="soundcloud-logo.png"> SoundCloud</a>

<a class="glass-btn" href="https://итд.com/artxikd">
<img src="itd-logo.png">
<span class="itd-sub">(мой ник в ИТД — @artxikd)</span>
</a>

</div>

<footer>nothing personal</footer>

</div>

<script>

/* loader */
const loader=document.querySelector('.loader');
window.onload=()=>setTimeout(()=>loader.style.display='none',500);

/* particles */
const container=document.getElementById("particles");

for(let i=0;i<40;i++){
let p=document.createElement("div");
p.className="particle";

p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(5+Math.random()*5)+"s";
p.style.opacity=Math.random();

container.appendChild(p);
}

</script>

</body>
</html>
