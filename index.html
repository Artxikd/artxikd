<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artxikd</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(135deg, #0b0b0d 0%, #1a1a23 100%);
color:#e5e5e5;
overflow-x:hidden;
-webkit-font-smoothing:antialiased;
}

/* loader */
.loader{
position:fixed;
inset:0;
background:#0b0b0d;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.loader-dot{
width:8px;
height:8px;
border-radius:50%;
background:#3b82f6;
box-shadow:0 0 10px rgba(59,130,246,.6);
animation:pulse 1.2s infinite;
}
@keyframes pulse{
0%{transform:scale(1);opacity:.6;}
50%{transform:scale(1.6);opacity:1;}
100%{transform:scale(1);opacity:.6;}
}

/* card */
.card{
width:90%;
max-width:340px;
padding:22px;
animation:fadeCard .6s ease forwards;
opacity:0;
transform:translateY(10px);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
background: rgba(255,255,255,0.05);
border-radius:20px;
box-shadow: 0 12px 30px rgba(0,0,0,0.4);
}

/* avatar */
.avatar{
width:82px;
height:82px;
border-radius:50%;
margin:0 auto 12px;
background:url("avatar.jpg") center/cover no-repeat;
filter:grayscale(100%);
}

/* name */
.name{
display:flex;
justify-content:center;
align-items:center;
gap:6px;
}
h1{
font-size:18px;
font-weight:500;
}
.check{
color:#3b82f6;
font-size:14px;
}

/* description */
.desc{
text-align:center;
font-size:12px;
opacity:.55;
margin:6px 0 18px;
letter-spacing:1px;
}

/* buttons */
.section{
display:flex;
flex-direction:column;
gap:10px;
}

/* liquid glass buttons */
.glass-btn{
display:flex;
align-items:center;
gap:10px;
padding:12px 16px;
border-radius:16px;
text-decoration:none;
color:#e5e5e5;
background: rgba(255,255,255,0.07);
border:1px solid rgba(255,255,255,0.14);
backdrop-filter: blur(18px) saturate(160%);
-webkit-backdrop-filter: blur(18px) saturate(160%);
box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.12);
transition: transform .18s ease, background .2s ease;
font-size:14px;
transform:translateZ(0);
will-change:transform;
opacity:0;
animation:slide 0.8s cubic-bezier(.22,1,.36,1) forwards;
}

.glass-btn img{
width:22px;
height:22px;
}

.glass-btn:hover{
background: rgba(255,255,255,0.12);
}

.glass-btn:active{
transform:scale(.97);
}

@keyframes slide{
0%{opacity:0; transform:translateY(18px);}
100%{opacity:1; transform:translateY(0);}
}

/* itd text */
.itd-sub{
font-size:12px;
opacity:.55;
}

/* footer */
footer{
text-align:center;
font-size:10px;
opacity:.25;
margin-top:10px;
}

</style>
</head>
<body>

<div class="loader">
<div class="loader-dot"></div>
</div>

<div class="card">

<div class="avatar"></div>

<div class="name">
<h1>artxikd</h1>
<i class="fa-solid fa-circle-check check"></i>
</div>

<div class="desc">ﮩ٨ـﮩﮩ٨ـ♡ﮩ٨ـﮩﮩ٨ـ</div>

<div class="section">

<a class="glass-btn" style="animation-delay:.2s" href="https://www.instagram.com/_artxikd_?igsh=NHUxazkzMmluZmVu" target="_blank">
<i class="fa-brands fa-instagram"></i> Instagram
</a>

<a class="glass-btn" style="animation-delay:.35s" href="https://t.me/artxikd" target="_blank">
<i class="fa-brands fa-telegram"></i> Telegram
</a>

<a class="glass-btn" style="animation-delay:.5s" href="https://vm.tiktok.com/ZNRBYrefc/" target="_blank">
<i class="fa-brands fa-tiktok"></i> TikTok
</a>

<a class="glass-btn" style="animation-delay:.65s" href="#">
<img src="soundcloud-logo.png"> SoundCloud
</a>

<a class="glass-btn" style="animation-delay:.8s" href="https://итд.com/artxikd" target="_blank">
<img src="itd-logo.png">
<span class="itd-sub">(мой ник в ИТД — @artxikd)</span>
</a>

<a class="glass-btn" style="animation-delay:.95s" href="https://t.me/artxikddd" target="_blank">
<i class="fa-solid fa-broadcast-tower"></i> Telegram Channel
</a>

<a class="glass-btn" style="animation-delay:1.1s" href="https://bumpmaps.com/p/pbVs1QRBgAyxD" target="_blank">
<i class="fa-solid fa-user-plus"></i> Add on Bump
</a>

</div>

<footer>nothing personal</footer>

</div>

<script>
const loader=document.querySelector('.loader');
function hideLoader(){
loader.style.opacity=0;
setTimeout(()=>loader.style.display='none',400);
}
window.addEventListener('load',hideLoader);
setTimeout(hideLoader,1400);
</script>

</body>
</html>
