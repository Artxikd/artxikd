<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artxikd</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b0b0d;
  color:#e5e5e5;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling: touch;
}

/* Loader */
.loader{
  position:fixed;
  inset:0;
  background:#0b0b0d;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.loader-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#3b82f6;
  box-shadow:0 0 12px rgba(59,130,246,0.6);
  animation:pulse 1.4s infinite;
}
@keyframes pulse{0%{transform:scale(1);opacity:.6;}50%{transform:scale(1.8);opacity:1;}100%{transform:scale(1);opacity:.6;}}

/* Card */
.card{
  width:90%;
  max-width:340px;
  padding:20px;
  z-index:2;
  opacity:0;
  transform:translateY(20px);
  animation:fadeInCard 1s ease forwards 0.5s;
  position:relative;
}
@keyframes fadeInCard{ to{opacity:1; transform:translateY(0);} }

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  margin:0 auto 12px;
  background:url("avatar.jpg") center/cover no-repeat;
  filter:grayscale(100%);
  opacity:0;
  transform:translateY(-10px);
  animation:fadeInAvatar 1s ease forwards 0.8s;
}
@keyframes fadeInAvatar{ to{opacity:1; transform:translateY(0);} }

.name{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  opacity:0;
  animation:fadeInName 1s ease forwards 1.2s;
}
@keyframes fadeInName{ to{opacity:1;} }

h1{ font-size:18px; font-weight:500; }

.check{
  color:#3b82f6;
  font-size:14px;
  opacity:0;
  animation:checkIn 1s ease forwards 1.6s;
}
@keyframes checkIn{ to{opacity:1;} }

.desc{
  text-align:center;
  font-size:12px;
  opacity:.55;
  margin:6px 0 18px;
  letter-spacing:1px;
  animation:fadeInDesc 1s ease forwards 1.4s;
  opacity:0;
}
@keyframes fadeInDesc{ to{opacity:.55;} }

/* Sections (панели с кнопками) */
.section{
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Glass buttons with slide-in */
.glass-btn{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  border-radius:16px;
  text-decoration:none;
  color:#e5e5e5;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  transition:.2s;
  font-size:14px;
  opacity:0;
  transform:translateY(20px);
  animation:slideIn 0.6s forwards;
}
.glass-btn:active{ transform:scale(.97); }
.glass-btn:hover{ background: rgba(255,255,255,0.12); box-shadow:0 0 18px rgba(59,130,246,.3);}
.glass-btn img{ display:block; width:22px; height:22px; }

@keyframes slideIn{
  to{opacity:1; transform:translateY(0);}
}

footer{
  text-align:center;
  font-size:10px;
  opacity:.25;
  margin-top:10px;
  animation:fadeInFooter 1s ease forwards 3.2s;
  opacity:0;
}
@keyframes fadeInFooter{ to{opacity:.25;} }

/* Mobile adjustments */
@media (max-width:400px){
  .card{padding:16px;}
  .avatar{width:70px; height:70px;}
  h1{font-size:17px;}
  .glass-btn{padding:10px 14px; font-size:13px; gap:8px;}
  .desc{font-size:11px;margin-bottom:14px;}
}
</style>
</head>

<body>

<div class="loader">
  <div class="loader-dot"></div>
</div>

<div class="card">

<div class="avatar"></div>

<div class="name">
  <h1>artxikd</h1>
  <i class="fa-solid fa-circle-check check"></i>
</div>

<div class="desc">ﮩ٨ـﮩﮩ٨ـ♡ﮩ٨ـﮩﮩ٨ـ</div>

<!-- Все кнопки вместе -->
<div class="section">
  <a class="glass-btn" style="animation-delay:1.8s" href="https://www.instagram.com/_artxikd_?igsh=NHUxazkzMmluZmVu" target="_blank">
    <i class="fa-brands fa-instagram"></i> Instagram
  </a>
  <a class="glass-btn" style="animation-delay:2.0s" href="https://t.me/artxikd" target="_blank">
    <i class="fa-brands fa-telegram"></i> Telegram
  </a>
  <a class="glass-btn" style="animation-delay:2.2s" href="https://vm.tiktok.com/ZNRBYrefc/" target="_blank">
    <i class="fa-brands fa-tiktok"></i> TikTok
  </a>
  <!-- SoundCloud кнопка -->
  <a class="glass-btn" style="animation-delay:2.35s" href="https://soundcloud.com/твоя_страница" target="_blank">
    <img src="soundcloud-logo.png" alt="SoundCloud">
    <div><span style="font-size:12px;opacity:.6;">SoundCloud</span></div>
  </a>
  <a class="glass-btn" style="animation-delay:2.4s" href="https://итд.com/artxikd" target="_blank">
    <img src="itd-logo.png" alt="ITD">
    <div><span style="font-size:12px;opacity:.6;">(мой ник в ИТД — @artxikd)</span></div>
  </a>
  <a class="glass-btn" style="animation-delay:2.6s" href="https://t.me/artxikddd" target="_blank">
    <i class="fa-solid fa-broadcast-tower"></i> Telegram Channel
  </a>
  <a class="glass-btn bump" style="animation-delay:2.8s" href="https://bumpmaps.com/p/pbVs1QRBgAyxD" target="_blank">
    <i class="fa-solid fa-user-plus"></i> Add on Bump
  </a>
</div>

<footer>nothing personal</footer>

<script>
// Убираем loader после полной загрузки страницы
const loader = document.querySelector('.loader');

function hideLoader(){
    loader.style.transition = 'opacity 0.5s ease';
    loader.style.opacity = 0;
    setTimeout(()=> loader.style.display = 'none', 500);
}

// Основное событие загрузки
window.addEventListener('load', hideLoader);

// Фолбэк на случай, если load зависнет
setTimeout(hideLoader, 2000); // через 2 секунды скрываем loader в любом случае
</script>

</body>
</html>
