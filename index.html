<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artxikd</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b0b0d;
  color:#e5e5e5;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling: touch;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:1;
  transform: translate3d(0,0,0);
  transition: transform 0.1s linear;
}

/* Loader */
.loader{
  position:fixed;
  inset:0;
  background:#0b0b0d;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.loader-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#3b82f6;
  box-shadow:0 0 12px rgba(59,130,246,0.6);
  animation:pulse 1.4s infinite;
}
@keyframes pulse{0%{transform:scale(1);opacity:.6;}50%{transform:scale(1.8);opacity:1;}100%{transform:scale(1);opacity:.6;}}

/* Card */
.card{
  width:90%;
  max-width:340px;
  padding:20px;
  z-index:2;
  opacity:0;
  transform:translateY(20px);
  animation:fadeInCard 1s ease forwards 0.5s;
  position:relative;
}
@keyframes fadeInCard{ to{opacity:1; transform:translateY(0);} }

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  margin:0 auto 12px;
  background:url("avatar.jpg") center/cover no-repeat;
  filter:grayscale(100%);
  opacity:0;
  transform:translateY(-10px);
  animation:fadeInAvatar 1s ease forwards 0.8s;
}
@keyframes fadeInAvatar{ to{opacity:1; transform:translateY(0);} }

.name{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  opacity:0;
  animation:fadeInName 1s ease forwards 1.2s;
}
@keyframes fadeInName{ to{opacity:1;} }

h1{ font-size:18px; font-weight:500; }

.check{
  color:#3b82f6;
  font-size:14px;
  opacity:0;
  animation:checkIn 1s ease forwards 1.6s;
}
@keyframes checkIn{ to{opacity:1;} }

.desc{
  text-align:center;
  font-size:12px;
  opacity:.55;
  margin:6px 0 18px;
  letter-spacing:1px;
  animation:fadeInDesc 1s ease forwards 1.4s;
  opacity:0;
}
@keyframes fadeInDesc{ to{opacity:.55;} }

/* Sections */
.section-title{
  font-size:12px;
  color:rgba(255,255,255,0.4);
  margin-bottom:6px;
  letter-spacing:1px;
  opacity:0;
  animation:fadeInTitle 1s ease forwards 1.5s;
}
@keyframes fadeInTitle{ to{opacity:1;} }

.section{
  background: rgba(255,255,255,.08);
  border-radius: 20px;
  padding: 10px;
  backdrop-filter: blur(14px);
  margin-bottom: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transform:translateY(10px);
  opacity:0;
  animation:fadeInSection 0.8s ease forwards;
  position:relative;
  overflow:hidden;
}
.section::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(120deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 60%);
  transform:rotate(45deg) translateX(-100%);
  transition: transform 0.8s ease;
}
.section:hover::before{
  transform:rotate(45deg) translateX(200%);
}
.section:nth-child(1){ animation-delay:1.6s; }
.section:nth-child(2){ animation-delay:2.4s; }
@keyframes fadeInSection{ to{opacity:1; transform:translateY(0);} }

.glass-btn{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  border-radius:16px;
  text-decoration:none;
  color:#e5e5e5;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  transition:.2s;
  font-size:14px;
}
.glass-btn:active{ transform:scale(.97); }
.glass-btn:hover{ background: rgba(255,255,255,0.12); box-shadow:0 0 18px rgba(59,130,246,.3);}
.glass-btn img{ display:block; width:22px; height:22px; }

footer{
  text-align:center;
  font-size:10px;
  opacity:.25;
  margin-top:10px;
  animation:fadeInFooter 1s ease forwards 3.2s;
  opacity:0;
}
@keyframes fadeInFooter{ to{opacity:.25;} }

/* Mobile adjustments */
@media (max-width:400px){
  .card{padding:16px;}
  .avatar{width:70px; height:70px;}
  h1{font-size:17px;}
  .glass-btn{padding:10px 14px; font-size:13px; gap:8px;}
  .section{padding:8px;}
  .desc{font-size:11px;margin-bottom:14px;}
}
</style>
</head>

<body>

<div class="loader">
  <div class="loader-dot"></div>
</div>

<div class="card">

<div class="avatar"></div>

<div class="name">
  <h1>artxikd</h1>
  <i class="fa-solid fa-circle-check check"></i>
</div>

<div class="desc">ﮩ٨ـﮩﮩ٨ـ♡ﮩ٨ـﮩﮩ٨ـ</div>

<!-- Section 1: Соцсети -->
<div class="section-title">Мои соцсети</div>
<div class="section">
  <a class="glass-btn" href="https://www.instagram.com/_artxikd_?igsh=NHUxazkzMmluZmVu" target="_blank">
    <i class="fa-brands fa-instagram"></i> Instagram
  </a>
  <a class="glass-btn" href="https://t.me/artxikd" target="_blank">
    <i class="fa-brands fa-telegram"></i> Telegram
  </a>
  <a class="glass-btn" href="https://vm.tiktok.com/ZNRBYrefc/" target="_blank">
    <i class="fa-brands fa-tiktok"></i> TikTok
  </a>
  <a class="glass-btn" href="https://итд.com/artxikd" target="_blank">
    <img src="itd-logo.png" alt="ITD">
    <div><span style="font-size:12px;opacity:.6;">(мой ник в ИТД — @artxikd)</span></div>
  </a>
</div>

<!-- Section 2: Приложения -->
<div class="section-title">Мои приложения</div>
<div class="section">
  <a class="glass-btn" href="https://t.me/artxikddd" target="_blank">
    <i class="fa-solid fa-broadcast-tower"></i> Telegram Channel
  </a>
  <a class="glass-btn bump" href="https://bumpmaps.com/p/pbVs1QRBgAyxD" target="_blank">
    <i class="fa-solid fa-user-plus"></i> Add on Bump
  </a>
</div>

<footer>nothing personal</footer>

<script>
// Parallax движения фона
document.addEventListener("mousemove", e=>{
  const x = (e.clientX / window.innerWidth - 0.5) * 10;
  const y = (e.clientY / window.innerHeight - 0.5) * 10;
  document.body.style.setProperty('--bg-x', `${x}px`);
  document.body.style.setProperty('--bg-y', `${y}px`);
});
</script>

</body>
</html>
